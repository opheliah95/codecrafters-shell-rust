[package]
name = "codecrafters-shell"
version = "0.1.0"
authors = ["Codecrafters <hello@codecrafters.io>"]
edition = "2024"
rust-version = "1.96"

[dependencies]
anyhow = "1.0.68"                                # error handling
bytes = "1.3.0"                                  # helps manage buffers
thiserror = "1.0.38"                             # error handling
is_executable = "1.0"
regex = "1.13.0"
shellwords = "1.1.0"
proc-macro2="1.0.107"
rustyline = {version="18.0.0", features=[ "with-file-history", "derive", "custom-bindings"]}
crossterm = "0.29.0"
glob = "0.3.3"

[lib]
path="src/lib.rs"
